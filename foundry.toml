[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@reactive/=lib/reactive-lib-omni/",
]

[profile.small]
optimizer = true
optimizer_runs = 1

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
lasna = "https://lasna-rpc.rnk.dev/"

[fmt]
line_length = 120
